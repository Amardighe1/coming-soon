<!-- Vercel Deployment Fix -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIZEN - RITP | Classified Event</title>
    <link rel="stylesheet" href="style.css">
    <!-- Importing a font similar to the Stranger Things font (Benguiat) and a terminal font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Roboto+Mono:wght@400;700&family=Rubik+Glitch&display=swap" rel="stylesheet">
</head>
<body>

    <!-- CRT Screen Effects -->
    <div class="scanlines"></div>
    <div class="noise"></div>
    <div class="vignette"></div>

    <div class="container">
        <header>
            <h1 class="top-title">COMING SOON</h1>
            <p class="terminal-text" id="typing-text">CONNECTING TO RITP SERVER...</p>
        </header>

        <main>
            <div class="image-wrapper">
                <img src="public/image.png" alt="Access Denied" class="glitch-image">
                <div class="glitch-layer"></div>
            </div>

            <div class="title-section">
                <h2 class="sub-title">RITP PRESENTS</h2>
                <h1 class="main-title" data-text="KAIZEN">KAIZEN</h1>
                <p class="event-status">/// CLASSIFIED EVENT INCOMING ///</p>
            </div>
        </main>

        <footer>
            <div class="countdown">
                <span>T-MINUS: </span>
                <span id="timer">COMING SOON</span>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
